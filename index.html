<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--green:#128C7E;--green-dark:#0a6b5e;--green-light:#E1F5EE;--green-text:#085041;--amber:#BA7517;--amber-light:#FAEEDA;--amber-text:#633806;--red:#A32D2D;--red-light:#FCEBEB;--blue:#185FA5;--blue-light:#E6F1FB;--blue-text:#0C447C;--purple:#534AB7;--purple-light:#EEEDFE;--purple-text:#3C3489;--border:#e0e0e0;--radius:10px;--radius-sm:6px}

#app{max-width:480px;margin:0 auto;min-height:100vh;background:#fff;display:flex;flex-direction:column}

.role-btn{background:rgba(255,255,255,0.15);border:none;color:#fff;font-size:11px;padding:5px 9px;border-radius:20px;cursor:pointer;position:relative;transition:background 0.15s;font-weight:500}

.notif-badge{position:absolute;top:-4px;right:-4px;background:#EF9F27;color:#fff;font-size:9px;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;border:1.5px solid var(--green)}
.nav{display:flex;background:#fff;border-bottom:1px solid var(--border);flex-shrink:0;overflow-x:auto}

.nav-tab{flex:1;min-width:fit-content;padding:10px 12px;text-align:center;font-size:11px;color:#888;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:color 0.15s;font-weight:500}
.nav-tab.active{color:var(--green);border-bottom-color:var(--green);font-weight:600}
.view{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.filter-bar{padding:8px 12px;background:#f8f8f8;border-bottom:1px solid var(--border);display:flex;gap:7px;align-items:center;position:sticky;top:0;z-index:10}

.info-btn{background:rgba(255,255,255,0.2);border:1.5px solid rgba(255,255,255,0.6);color:#fff;border-radius:50%;width:30px;height:30px;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;background:var(--green)}
.cat-bar{display:flex;gap:6px;padding:8px 12px;overflow-x:auto;background:#f8f8f8;border-bottom:1px solid var(--border)}

.new-banner{background:var(--green-light);padding:8px 14px;font-size:12px;color:var(--green-text);display:flex;align-items:center;gap:6px;border-bottom:1px solid #b2ddd4}

.section-head{padding:12px 14px 6px;font-size:12px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:0.5px}

function daysRemaining(createdAt, listingDays) {
  if (!createdAt) return listingDays || 14;
  const created = createdAt.toDate ? createdAt.toDate() : new Date(createdAt);
  const expiry = new Date(created.getTime() + (listingDays || 14) * 86400000);
  const diff = Math.ceil((expiry - new Date()) / 86400000);
  return Math.max(0, diff);
}
function expiryBadge(listing) {
  const days = daysRemaining(listing.createdAt, pricing.listingDays);
  if (days <= 0) return '<span class="status-pill" style="background:#FCEBEB;color:#A32D2D">Expired</span>';
  if (days <= 3) return `<span class="status-pill" style="background:#FAEEDA;color:#BA7517">${days}d left</span>`;
  return `<span class="status-pill status-live">${days}d left</span>`;
}

async function init() {
  try { pricing = await getPricing(); } catch(e) {}
  try { await loadListings(); } catch(e) {}

  setRole('buyer');
}

async function getPricing() {
  const doc = await db.collection('settings').doc('pricing').get();
  return doc.exists ? doc.data() : pricing;
}

async function savePricing(p) {
  await db.collection('settings').doc('pricing').set(p);
}

async function loadListings() {
  try {
    const snap = await db.collection('listings')
      .where('active','==',true)
      .get();
    const docs = snap.docs.map(d => ({id:d.id,...d.data()}));
    docs.sort((a,b) => {
      if (a.boosted && !b.boosted) return -1;
      if (!a.boosted && b.boosted) return 1;
      const ta = a.createdAt ? (a.createdAt.toDate ? a.createdAt.toDate().getTime() : 0) : 0;
      const tb = b.createdAt ? (b.createdAt.toDate ? b.createdAt.toDate().getTime() : 0) : 0;
      return tb - ta;
    });
    allListings = docs;
  } catch(e) {
    console.error('loadListings error:', e);
    allListings = [];
  }
}

async function loadNotifs() {
  const snap = await db.collection('boostRequests').orderBy('createdAt','desc').limit(50).get();
  allNotifs = snap.docs.map(d => ({id:d.id,...d.data()}));
}

async function loadPayments() {
  const snap = await db.collection('payments').orderBy('createdAt','desc').limit(100).get();
  allPayments = snap.docs.map(d => ({id:d.id,...d.data()}));
}

function setRole(r) {

function buildNav() {

function showTab(i) {

function getSortedListings(q, cat) {
  let list = allListings.filter(l => {
    if (cat && cat !== 'All' && l.category !== cat) return false;
    if (q) {
      const ql = q.toLowerCase();
      if (!l.name.toLowerCase().includes(ql) && !l.area.toLowerCase().includes(ql)) return false;
    }
    return true;
  });
  if (located && userLat) {
    list = list.map(l => ({...l, km: calcDist(userLat,userLng,l.lat||-26.2,l.lng||28.0)}))
      .filter(l => l.km <= radiusKm)
      .sort((a,b) => a.km - b.km);
  }
  return [...list.filter(l=>l.boosted), ...list.filter(l=>!l.boosted)];
}

function calcDist(lat1,lng1,lat2,lng2) {
  const R=6371, dLat=(lat2-lat1)*Math.PI/180, dLng=(lng2-lng1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function buildCards(list) {
  if (!list.length) return `<div class="empty-state" style="grid-column:span 2"><div class="empty-icon">🔍</div>No listings found</div>`;
  return list.map(l => {
    const pc = l.payment==='SnapScan'?'pay-snap':l.payment==='Both'?'pay-both':'pay-cod';
    const pl = l.payment==='SnapScan'?'SnapScan':l.payment==='Both'?'COD+Snap':'COD';
    const hasPhoto = l.photos && l.photos.length > 0;
    const imgHtml = hasPhoto ? `<img src="${l.photos[0]}" onerror="this.style.display='none'">` : `<span class="card-emoji">${emojis[l.category]||'📦'}</span>`;
    const kmHtml = (located && l.km!=null) ? ` <span class="card-km">${l.km.toFixed(1)}km</span>` : '';
    return `<div class="card${l.boosted?' boosted':''}">
      <div class="card-img-wrap">${imgHtml}
        ${l.boosted?`<div class="card-tag tag-boost">${t('featured')}</div>`:''}
        ${l.verified&&!l.boosted?`<div class="card-tag tag-verify">${t('verified')}</div>`:''}
        ${l.isNew&&!l.boosted?`<div class="card-tag tag-new">${t('newTag')}</div>`:''}
      </div>
      <div class="card-body">
        <div class="card-name">${l.name}</div>
        <div class="card-loc">📍 ${l.area}${kmHtml}</div>
        <div class="card-price">R${l.price}</div>
      </div>
      <div class="card-foot">
        <span class="pay-pill ${pc}">${pl}</span>
        <button class="wa-btn" onclick="waContact('${l.phone||''}','${l.name.replace(/'/g,'')}')">${t('whatsapp')}</button>
      </div>
    </div>`;
  }).join('');
}

function doNearMe() {
  if (located) { located=false; userLat=null; userLng=null; renderBrowse(); return; }
  const btn = document.getElementById('near-btn');
  if (btn) { btn.textContent='📍 Locating...'; btn.disabled=true; }
  navigator.geolocation.getCurrentPosition(pos => {
    userLat=pos.coords.latitude; userLng=pos.coords.longitude; located=true;
    renderBrowse(); showToast('Located — within '+radiusKm+'km');
  }, () => {
    userLat=-26.195; userLng=28.034; located=true;
    renderBrowse(); showToast('Using approximate location');
  });
}

function removeExistingPhoto(i) {
  editingExistingPhotos.splice(i, 1);
  const row = document.getElementById('existing-photo-row');
  if (row) row.innerHTML = editingExistingPhotos.map((url,idx) => `
    <div class="photo-thumb">
      <img src="${url}" onerror="this.src=''">
      <button class="photo-rm" onclick="removeExistingPhoto(${idx})">✕</button>
    </div>`).join('');
}

function handleEditPhotos(files) {
  const remaining = 5 - editingExistingPhotos.length - selectedPhotos.length;
  const toAdd = Array.from(files).slice(0, remaining);
  if (files.length > remaining) showToast('Maximum 5 photos total');
  toAdd.forEach(file => {
    const reader = new FileReader();
    reader.onload = e => { selectedPhotos.push({file, dataUrl:e.target.result}); renderEditNewPhotos(); };
    reader.readAsDataURL(file);
  });
}

function renderEditNewPhotos() {
  const row = document.getElementById('new-photo-row');
  if (!row) return;
  row.innerHTML = selectedPhotos.map((p,i) => `
    <div class="photo-thumb">
      <img src="${p.dataUrl}">
      <button class="photo-rm" onclick="removeNewEditPhoto(${i})">✕</button>
    </div>`).join('');
}

function removeNewEditPhoto(i) { selectedPhotos.splice(i,1); renderEditNewPhotos(); }

async function saveEdit() {
  const name = document.getElementById('f-name')?.value?.trim();
  const price = document.getElementById('f-price')?.value;
  const area = document.getElementById('f-area')?.value?.trim();
  const phone = document.getElementById('f-phone')?.value?.trim();
  const desc = document.getElementById('f-desc')?.value?.trim();
  const cat = document.getElementById('f-cat')?.value;
  if (!name||!price||!area||!phone) { showToast('Please fill in all required fields'); return; }
  const btn = document.querySelector('.btn-primary');
  if (btn) { btn.textContent='Saving...'; btn.disabled=true; }
  try {
    let photos = [...editingExistingPhotos];
    if (selectedPhotos.length > 0) {
      for (let i=0; i<selectedPhotos.length; i++) {
        const ref = storage.ref(`listings/${editingListingId}/edit_photo_${Date.now()}_${i}`);
        await ref.put(selectedPhotos[i].file);
        photos.push(await ref.getDownloadURL());
      }
    }
    await db.collection('listings').doc(editingListingId).update({
      name, price:parseFloat(price), area, phone, category:cat,
      payment:selectedPay, description:desc||'', photos,
      boosted:false, boostExpiry:null, isNew:false,
      updatedAt:firebase.firestore.FieldValue.serverTimestamp()
    });
    editingListingId = null;
    editingExistingPhotos = [];
    selectedPhotos = [];
    await loadListings();
    showToast('Listing updated successfully');
    renderMyListings();
  } catch(err) {
    showToast('Error saving: ' + err.message);
    if (btn) { btn.textContent='Save changes'; btn.disabled=false; }
  }
}

      <div style="font-size:12px;color:#888;margin-bottom:10px">${pricing.freeListings-count} free listing${pricing.freeListings-count!==1?'s':''} remaining</div>
      <button class="btn-primary" onclick="submitListing()">List Item — Free</button>
    </div>`);
}

function handlePhotos(files) {
  const remaining = 5 - selectedPhotos.length;
  const toAdd = Array.from(files).slice(0, remaining);
  if (files.length > remaining) showToast('Maximum 5 photos allowed');
  toAdd.forEach(file => {
    if (selectedPhotos.length >= 5) return;
    const reader = new FileReader();
    reader.onload = e => { selectedPhotos.push({file, dataUrl:e.target.result}); renderPhotoRow(); };
    reader.readAsDataURL(file);
  });
}

function renderPhotoRow() {
  const row = document.getElementById('photo-row');
  if (!row) return;
  row.innerHTML = selectedPhotos.map((p,i) => `
    <div class="photo-thumb">
      <img src="${p.dataUrl}">
      <button class="photo-rm" onclick="removePhoto(${i})">✕</button>
    </div>`).join('');
}

function removePhoto(i) { selectedPhotos.splice(i,1); renderPhotoRow(); }

function selPayOpt(val) {
  selectedPay = val;
  ['cash','snap','both'].forEach(k => document.getElementById('po-'+k)?.classList.remove('sel'));
  const map = {Cash:'cash',SnapScan:'snap',Both:'both'};
  document.getElementById('po-'+map[val])?.classList.add('sel');
}

async function submitListing() {
  const name = document.getElementById('f-name')?.value?.trim();
  const price = document.getElementById('f-price')?.value;
  const area = document.getElementById('f-area')?.value?.trim();
  const phone = document.getElementById('f-phone')?.value?.trim();
  const desc = document.getElementById('f-desc')?.value?.trim();
  const cat = document.getElementById('f-cat')?.value;
  if (!name||!price||!area||!phone) { showToast('Please fill in all required fields'); return; }
  const btn = document.querySelector('.btn-primary');
  if (btn) { btn.textContent='Uploading...'; btn.disabled=true; }
  try {
    const docRef = await db.collection('listings').add({
      name, price:parseFloat(price), area, phone, category:cat,
      payment:selectedPay, description:desc||'', photos:[],
      active:true, boosted:false, verified:false, isNew:true,
      lat:userLat||-26.2, lng:userLng||28.0,
      createdAt:firebase.firestore.FieldValue.serverTimestamp()
    });
    if (selectedPhotos.length > 0) {
      const urls = [];
      for (let i=0; i<selectedPhotos.length; i++) {
        const ref = storage.ref(`listings/${docRef.id}/photo_${i}`);
        await ref.put(selectedPhotos[i].file);
        urls.push(await ref.getDownloadURL());
      }
      await db.collection('listings').doc(docRef.id).update({photos:urls});
    }
    sellerPhone = phone;
    localStorage.setItem('spaza_phone', phone);
    await db.collection('boostRequests').add({
      type:'new', title:`New listing — ${area}`,
      body:`${name} listed by ${phone}.`,
      status:'info', createdAt:firebase.firestore.FieldValue.serverTimestamp()
    });
    await loadListings();
    showToast('Listed! Nearby buyers notified.');
    setTimeout(() => showTab(0), 1500);
  } catch(err) {
    console.error('submitListing error:', err);
    showToast('Saved! (photos need Blaze plan)');
    await loadListings();
    setTimeout(() => { setRole('seller'); showTab(0); }, 1500);
  }
}

  try {
    await db.collection('boostRequests').add({
      type:'boost', seller:sellerPhone, plan:planNames[plan],
      price:`R${price}`, method:methods[plan], status:'pending',
      createdAt:firebase.firestore.FieldValue.serverTimestamp()
    });
    await loadNotifs();
    updateNotifBadge();
    const msg = encodeURIComponent(`New boost request from ${sellerPhone}: ${planNames[plan]} — R${price} via ${methods[plan]}`);

}

      const isBoost = n.type==='boost';
      const isPend = n.status==='pending';

      const timeStr = n.createdAt?.toDate ? n.createdAt.toDate().toLocaleTimeString('en-ZA',{hour:'2-digit',minute:'2-digit'}) : 'just now';
      return `<div class="notif-card ${cls}">
        <div class="notif-top">

        ${isPend&&isBoost?`<div class="notif-actions">
          <button class="notif-btn amber" onclick="sendPayLink('${n.id}','${n.seller||''}','${n.price||''}')">Send payment link</button>

    }).join('')}`);

async function sendPayLink(id, phone, price) {
  const msg = encodeURIComponent(`Hi! Your Spaza Market boost has been received.\n\nAmount: ${price}\n\nPlease pay via SnapScan:\nhttps://pos.snapscan.io/qr/spazamarket\n\nOnce paid your listing will be boosted. — Spaza Market`);
  window.open(`https://wa.me/27${(phone||ADMIN_WA).replace(/^0/,'')}?text=${msg}`, '_blank');
  await db.collection('boostRequests').doc(id).update({status:'sent'});
  await db.collection('payments').add({
    seller:phone, amount:parseInt((price||'0').replace('R','')),
    plan:'Boost', method:'SnapScan',
    createdAt:firebase.firestore.FieldValue.serverTimestamp()
  });
  await loadNotifs(); await loadPayments();
  renderAdminNotifs();
  showToast('WhatsApp payment link sent');
}
